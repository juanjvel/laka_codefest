name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]

jobs:
  ci:
    name: Lint, compile check & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax / import smoke test
        run: python -m py_compile src/*.py

      - name: Install ruff
        run: pip install ruff==0.16.1

      - name: Lint with ruff
        run: ruff check src/

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        # tests/ todavía no tiene casos reales: pytest devuelve el código 5
        # ("no se recolectaron tests"), que aquí se trata como éxito. En
        # cuanto existan tests/test_*.py, este mismo step empieza a
        # ejecutarlos y a fallar si fallan, sin tocar este archivo.
        run: pytest --no-header -q || [ "$?" -eq 5 ]
