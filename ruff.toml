# Config mínima de ruff para el CI (ver .github/workflows/ci.yml).
# Sin esto, ruff activa por defecto un set de reglas mucho más amplio
# (bugbear, refurb, bandit, isort...) que generaría falsos positivos
# sobre patrones ya existentes en el repo. Fijamos el set "clásico"
# (pycodestyle E/W + pyflakes F) hasta que el equipo decida ampliarlo.
target-version = "py312"
# El código existente (docstrings, prints y f-strings en español) usa
# líneas más largas que el default de 88; 140 cubre la línea más larga
# actual sin forzar un reflow del código de negocio en esta PR de CI.
line-length = 140

[lint]
select = ["E", "W", "F"]
